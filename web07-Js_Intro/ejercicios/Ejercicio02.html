<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web07-Ejercicio-02</title>
    <script>
        <script>
        function mostrarAlerta() {
            alert("¡Hola, mundo!");
        }
        function cambiarColorFondo() {
            document.body.style.backgroundColor = "lightblue";
        }
        function cambiarTexto() {
            document.body.innerHTML = "<h1>¡Texto cambiado!</h1>";
        }
    </script
    </script>
</head>
<body>
    

    <h1> Ejercicio 02</h1>
    <script>
    <button onclick="mostrarAlerta()">mostrarAlerta</button>

    <!--Agregar un botón que llame a la función CambiarColorFondo()-->
    <button onclick="cambiarColorFondo()">cambiarColorFondo</button>

    <!--Agregar un botón que llame a la función CambiarColorTexto()-->
    <button onclick="cambiarTexto()">cambiarTexto</button>

    function cambiarBackgroungDeBody() {
            document.body.style.backgroundColor = "green";
        }
        <button onclick="cambiarBackgroungDeBody()">cambiarBackgroungDeBody()</button>

    </script>    
    


    
</body>
</html>
